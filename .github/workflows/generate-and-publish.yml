name: Générer et publier (4 vidéos/jour)

on:
  schedule:
    # 4 exécutions/jour — 1 vidéo publiée DIRECTEMENT en public par exécution.
    # Heures locales Côte d'Ivoire (Africa/Abidjan = UTC+0) : minuit, 8h, 16h, 20h.
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rendu seul, sans upload"
        type: boolean
        default: false

# Les exécutions écrivent toutes dans src/db/*.json : on sérialise les push.
concurrency:
  group: autocipher-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache modèles Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-${{ runner.os }}-base

      - name: npm ci
        run: npm ci

      - name: pip install
        run: pip install -r requirements.txt

      - name: Lancer le pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WHISPER_MODEL: base
          TARGET_DURATION_SECONDS: "50"
          YOUTUBE_DAILY_UPLOAD_CAP: "6"
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node src/orchestrate.js --dry-run
          else
            node src/orchestrate.js
          fi

      - name: Commit de l'état (historique sujets, quota, rotation voix)
        if: always()
        run: |
          git config user.name "autocipher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db/*.json
          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "chore(db): maj état pipeline [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break || sleep 5
          done

      - name: Archiver les artefacts du run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: |
            output/**/summary.json
            output/**/script.json
            output/**/video.mp4
          retention-days: 7
          if-no-files-found: warn
