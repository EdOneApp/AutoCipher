name: Rattrapage — publier les vidéos privées en attente

# Déclenchement MANUEL uniquement (onglet Actions → Run workflow).
# Bascule en `public` les vidéos listées dans src/db/backlog.json restées
# `private` du temps de l'ancien flux de validation. À lancer une fois, puis
# ce workflow et src/db/backlog.json peuvent être supprimés.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Lister seulement, sans rien publier"
        type: boolean
        default: false

concurrency:
  group: autocipher-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: npm ci
        run: npm ci

      - name: Publier le backlog
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node src/publish_backlog.js --dry-run
          else
            node src/publish_backlog.js
          fi

      - name: Commit du backlog mis à jour
        if: always()
        run: |
          git config user.name "autocipher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db/backlog.json
          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "chore(db): rattrapage backlog publié [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break || sleep 5
          done
